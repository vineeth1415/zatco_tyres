<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>ZATCO Tyres - High Performance Rubber Engineering</title>
    <link rel="icon" type="image/png" href="images/zatco_z_symbol.png">
    <link rel="shortcut icon" type="image/png" href="images/zatco_z_symbol.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#00236f",
                        "secondary": "#bb0112",
                        "tertiary": "#1d2b3d",
                        "background": "#f7f9fb"
                    },
                    "fontFamily": {
                        "headline": ["IBM Plex Sans", "sans-serif"],
                        "body": ["Work Sans", "sans-serif"],
                        "mono": ["Josefin Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-900 text-slate-100 flex flex-col min-h-screen">
    <div id="header-placeholder"></div>

    <main class="flex-grow">
        <section class="py-20 px-6 max-w-[1280px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
            <div class="lg:col-span-7 space-y-6">
                <div
                    class="inline-block px-3 py-1 bg-red-950/80 border border-red-800 text-red-400 text-xs font-mono font-bold uppercase rounded">
                    Dark Titanium Series Architecture
                </div>
                <h1 class="font-headline font-bold text-4xl lg:text-6xl text-white tracking-tight leading-tight">
                    HIGH PAYLOAD STABILITY. ZERO SIDEWALL FAILURE.
                </h1>
                <p class="text-slate-300 text-lg leading-relaxed">
                    Designed for heavy commercial transport, light trucks, motorcycles, and high-traction agricultural
                    machinery across India.
                </p>
                <div class="flex gap-4">
                    <a href="product-detail.html"
                        class="bg-[#00236f] hover:bg-blue-800 text-white font-bold text-sm uppercase px-8 py-4 rounded transition">
                        View Product Lineup
                    </a>
                    <a href="dealer-portal.html"
                        class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-sm uppercase px-8 py-4 rounded transition">
                        Locate Dealer
                    </a>
                </div>
            </div>
            <div class="lg:col-span-5 relative bg-slate-950 p-4 rounded-xl border border-slate-800 shadow-2xl">
                <img src="images/IMG_0099.JPG.jpeg" alt="ZT-LCV Titan Load Tyre"
                    class="w-full h-80 object-cover rounded-lg">
                <div
                    class="mt-4 p-3 bg-slate-900 rounded border border-slate-800 flex justify-between text-xs font-mono">
                    <span class="text-slate-300">ZT-LCV Titan Load 12PR</span>
                    <span class="text-emerald-400 font-bold">12-Ply Steel Reinforced</span>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="components.js"></script>
</body>

</html>
